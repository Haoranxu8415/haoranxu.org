# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # Generated blocks (the navbar on every page, the works cards) are rebuilt from their sources, so a page that
      # wasn't rebuilt locally can't ship out of date. See tools/build.mjs.
      - name: Build generated blocks
        run: node tools/build.mjs
      # Browsers may reuse cached CSS/JS for 10 min (max-age=600) while fetching new
      # HTML, so right after a deploy returning visitors saw new markup with old styles.
      # Stamp every CSS/JS reference with this commit so each deploy gets fresh files.
      - name: Cache-bust CSS/JS references
        run: |
          V="${GITHUB_SHA::8}"
          find . -name '*.html' -not -path './.git/*' -print0 \
            | xargs -0 sed -i -E "s#(assets/(css|js)/[A-Za-z0-9_-]+\.(css|js))\"#\1?v=${V}\"#g"
          grep -rhoE 'assets/(css|js)/[^"]+\?v=[0-9a-f]+' --include='*.html' . | sort | uniq -c
      # Publish the site only: not the photo originals (full size, with EXIF incl. GPS —
      # the site serves stripped WebP copies), and not the repo's tooling and docs.
      - name: Leave non-site files out of the published site
        run: |
          rm -f assets/images/gallery/*.jpg assets/images/gallery/*.JPG assets/images/gallery/*.jpeg
          rm -rf tools _partials .github README.md LICENSE .gitattributes .gitignore
          find . -name '.DS_Store' -delete
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # The repository minus the step above
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
