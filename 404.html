<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>404 — Haoran Xu</title>
  <meta name="description" content="Page not found — Haoran Xu" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <link rel="apple-touch-icon" href="/favicon.png" />
  <meta name="theme-color" content="#0A1C16" />
  <meta name="color-scheme" content="dark" />
  <!-- Self-hosted fonts (see style.css §0); preload the two used above the fold -->
  <link rel="preload" href="/assets/fonts/dm-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="/assets/fonts/cormorant-garamond-300-normal-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/assets/css/style.css" />
  <style>
    .not-found {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: calc(100vh - var(--nav-h) - var(--topbar-h));
      text-align: center;
      padding: 0 var(--side-pad);
      animation: pageIn .4s var(--ease-out) both;
    }
    .not-found-code {
      font-family: var(--font-display);
      font-size: clamp(72px, 15vw, 120px);
      font-weight: 300;
      color: var(--gold);
      line-height: 1;
      margin-bottom: 16px;
    }
    .not-found-msg {
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-bottom: 36px;
    }
    .not-found-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--text-muted);
      border: 1px solid var(--gold-border);
      border-radius: var(--r-btn);
      padding: 8px 18px;
      transition: color .2s var(--ease-inout), border-color .2s var(--ease-inout);
    }
    .not-found-link:hover {
      color: var(--gold-light);
      border-color: var(--gold-border-em);
    }
  </style>
  <script type="speculationrules">{"prefetch":[{"where":{"href_matches":"/*"},"eagerness":"moderate"}]}</script>
</head>
<body>

  <div class="top-bar" aria-hidden="true"></div>

  <nav class="navbar" role="navigation" aria-label="Main navigation">
    <a href="/" class="nav-logo">Haoran Xu</a>

    <button class="menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="nav-wrapper">
      <ul class="nav-links">
        <li><a href="/">Home</a></li>
        <li><a href="/gallery.html">Gallery</a></li>
        <li><a href="/works.html">Works</a></li>
        <li><a href="/notes.html">Notes</a></li>
        <li><a href="/contact.html">Contact</a></li>
      </ul>
    </div>
  </nav>

  <main class="not-found">
    <div class="not-found-code">404</div>
    <p class="not-found-msg">Page not found</p>
    <a href="/" class="not-found-link">← Back to home</a>
  </main>

  <script defer src="/assets/js/main.js"></script>
</body>
</html>
